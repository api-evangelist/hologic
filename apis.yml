x-contract-discovery:
  checked: '2026-09-13'
  verdict: no-public-api-contract
  summary: >-
    No OpenAPI, Swagger, GraphQL SDL, AsyncAPI, MCP manifest, A2A agent card, gRPC proto or WSDL
    is published on any Hologic-controlled host. Hologic's integration contract is the DICOM
    Conformance Statement, published per product as PDF.
  hosts_probed:
    - www.hologic.com
    - hologic.com
    - www.hologic.co.uk
    - support.hologic.com
    - investor.hologic.com
    - dev.hologic.com
    - unificonnect.com
    - prod.unificonnect.com
    - dev.unificonnect.com
    - www.endomag.com
    - api.hologic.com
    - developer.hologic.com
    - developers.hologic.com
    - apis.hologic.com
    - connect.hologic.com
    - cloud.hologic.com
    - unifi.hologic.com
    - portal.hologic.com
    - my.hologic.com
  findings:
    - probe: REST OpenAPI on api/docs host roots
      result: >-
        api.hologic.com, developer.hologic.com, developers.hologic.com, apis.hologic.com,
        connect.hologic.com, cloud.hologic.com, unifi.hologic.com and portal.hologic.com have no
        DNS record at all. dev.hologic.com returns HTTP 401 with
        WWW-Authenticate Basic and x-ah-environment: dev — it is the basic-auth-protected Acquia
        staging copy of the marketing site, not a developer portal. my.hologic.com 302s to
        hologic.sharepoint.com. /openapi.json, /openapi.yaml, /swagger.json, /swagger/v1/swagger.json,
        /v1/openapi.json, /api-docs, /api/openapi.json, /docs, /redoc and /graphql all 404 on
        www.hologic.com and unificonnect.com.
    - probe: Unifi Connect platform hosts
      result: >-
        prod.unificonnect.com and dev.unificonnect.com serve an Angular SPA (title
        "Unifi-Analytics build version: 1.3") whose catch-all route answers HTTP 200 with the same
        2,054-byte index.html for EVERY path, including a negative-control path that cannot exist.
        Every 200 there is a shell, not a document. The Unifi Connect telemetry API these apps call
        is machine-to-machine between Hologic devices and the platform and is not publicly documented.
    - probe: GraphQL introspection
      result: No /graphql endpoint responds on any host; nothing to introspect.
    - probe: MCP tools/list
      result: >-
        No MCP endpoint found. Note the Salesforce Experience Cloud IdP at support.hologic.com
        advertises an mcp_api OAuth scope — that is a Salesforce platform capability, not a
        Hologic-operated MCP server, and it is recorded as such in scopes/hologic-scopes.yml.
    - probe: A2A agent card
      result: >-
        /.well-known/agent-card.json and /.well-known/agent.json miss on every host. The only 200s
        were the unificonnect.com SPA shells, rejected as HTML. No card written — correctly, since
        an agent card may only ever be recorded when the provider actually serves one.
    - probe: OGC surface
      result: Not applicable — no geospatial evidence anywhere in Hologic's material.
    - probe: WSDL / SOAP
      result: >-
        No ?wsdl or ?singleWsdl surface reachable. A published MuleSoft case study describes
        Hologic running SOAP and REST services internally behind an integration layer; none of it
        is externally published.
    - probe: DICOM Conformance Statement
      result: >-
        HIT, as PDF. Multiple first-party statements are public and fetchable, e.g. the Selenia
        Dimensions / 3Dimensions Acquisition Workstation statement MAN-05763 Rev 002 (HTTP 200,
        application/pdf), which declares real Application Entities and DICOM UIDs under
        1.2.840.10008 — Modality Worklist FIND, MPPS, Storage, Storage Commitment Push Model,
        Study Root Query/Retrieve FIND and MOVE, Print and Verification. Recorded in
        conformance/hologic-conformance.yml as the domain-standard conformance it is.
