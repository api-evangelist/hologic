description: >-
  Hologic, Inc. (NASDAQ: HOLX) is a global medical technology company focused on women's health,
  headquartered in Marlborough, Massachusetts. It develops, manufactures and supplies diagnostic
  products, medical imaging systems and GYN surgical solutions across four businesses: Breast
  Health, Diagnostic Solutions, GYN Surgical Solutions and Skeletal Health. Its products are
  FDA-cleared or CE-marked medical devices for trained healthcare professionals, and integration
  happens at the device — DICOM network services and HL7 feeds into RIS, PACS and LIS — rather
  than through a public web API. Hologic publishes no developer portal, OpenAPI or SDK; the
  contracts it does publish are per-product DICOM Conformance Statements and MDS2 security
  disclosure forms, both as PDF.
