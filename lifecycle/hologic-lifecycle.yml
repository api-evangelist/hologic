note: >-
  Hologic has no API, so it has no API versioning or API deprecation policy. What it does have
  is the device-industry equivalent, published openly and dated: the Hologic Imaging Product
  Obsolescence & End-of-Life Guide, which separates End of Sale from End of Life for every
  imaging product line and carries the year each notice was issued. For an integrator, that
  guide is the deprecation contract — it is what tells you the DICOM interface you built
  against is about to stop being supported. It is recorded here as the deprecation surface it
  actually is, not stretched into an API versioning claim it is not.
