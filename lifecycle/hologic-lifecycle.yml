versioning:
  api_versioning_policy: false
  note: >-
    No API, therefore no API version scheme. Product software versions are visible across the
    published document set (Selenia Dimensions v1.9 -> v1.12, 3Dimensions v2.0 -> v2.3,
    SecurView v8.x -> v12.x, Advanced Workflow Manager v1.9 -> v1.11), and each version has its
    own DICOM Conformance Statement and MDS2 form, but no policy document states a support
    window or an upgrade cadence.
