  title: Hologic Imaging Product Obsolescence & End-of-Life Guide
  scheme: >-
    Two stages per product — "End of Sale" (no longer orderable) then "End of Life" (support
    ends) — each published as a dated notice document, grouped by product family.
  machine_readable: false
  machine_readable_note: >-
    HTML list of links to PDF notices. No feed, no structured dates, no Sunset/Deprecation
    HTTP headers (there is no HTTP surface to carry them). A machine cannot diff this guide
    between visits.
  families_covered:
