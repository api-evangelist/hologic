    evidence_http_status: 200
    detail: >-
      Hologic publishes a completed MDS2 form for every Breast and Skeletal Health product —
      36 forms are linked from the index, covering Selenia Dimensions / 3Dimensions (v1.9
      through v1.12 / 2.3), SecurView (v8 through v12), Trident and Trident HD, Brevera,
