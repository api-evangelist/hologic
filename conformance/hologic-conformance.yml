generated: '2026-09-13'
method: searched
source: >-
  Hologic's own public document library on www.hologic.com — the DICOM Conformance Statements
  filed under /sites/default/files/, the MDS2 form index at
  /support/usa/Breast-Skeletal-Products-Cybersecurity/MDS2-forms, and the OpenID Connect
  discovery document served at support.hologic.com.
note: >-
  Hologic is a medical device manufacturer, not an API vendor. It publishes no OpenAPI,
  GraphQL SDL, AsyncAPI or MCP manifest, and no developer portal exists. What it DOES publish,
  publicly and without credentials, is the contract its market actually integrates against:
  per-product DICOM Conformance Statements (the DICOM standard's own PS3.2-prescribed
  conformance document) and per-product MDS2 security disclosure forms. Both are PDF. A human
  integrator can read them; a machine cannot. That is the finding, and it is recorded here
  rather than as an absence.
conformance:
  - id: dicom
    name: DICOM (NEMA PS3, ISO 12052)
    conforms: true
    domain_standard: true
    market: medical imaging
    evidence: >-
      https://www.hologic.com/sites/default/files/2019-12/Dimensions%20v1.10%20and%203Dimensions%20v2.1%20DICOM%20Conf.%20Statement%20(MAN-05763)%20English%20Rev_001%2010-2019.pdf
    evidence_http_status: 200
    evidence_format: application/pdf
    detail: >-
      Selenia Dimensions / 3Dimensions Acquisition Workstation DICOM Conformance Statement,
      part number MAN-05763 Rev 002, August 2019. Declares real DICOM Application Entities and
      SOP Classes: Modality Worklist Client (Modality Worklist Information Model - FIND),
      Modality Performed Procedure Step Client, Storage Client, Storage Commitment Client
      (Storage Commitment Push Model), Query/Retrieve Client (Study Root Q/R Information Model
      FIND and MOVE), Print Client and Verification (C-ECHO). Carries the DICOM-registered UID
      root 1.2.840.10008 throughout, including Digital Mammography X-Ray Image Storage - For
      Presentation (1.2.840.10008.5.1.4.1.1.1.2) and - For Processing
      (1.2.840.10008.5.1.4.1.1.1.2.1), Breast Tomosynthesis Image Storage
      (1.2.840.10008.5.1.4.1.1.13.1.3), Secondary Capture, Mammography CAD SR
      (1.2.840.10008.5.1.4.1.1.88.50) and JPEG Lossless / JPEG 2000 transfer syntaxes.
    machine_readable: false
    machine_readable_note: >-
      Published as PDF only. DICOM does not define a JSON/YAML serialization of a conformance
      statement, but the same content is what an OpenAPI would be for a REST API — it is the
      integration contract, and it is not fetchable as data.
    additional_evidence:
      - url: https://www.hologic.com/sites/default/files/2020-01/Selenia%20Dimensions-3Dimensions%20Acquisition%20Workstation%20v1.10-2.1%20DICOM%20Conformance%20Statement%20(MAN-05763)%20English%20Rev_001%2001-2019.pdf
        status: 200
