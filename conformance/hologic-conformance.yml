    name: HL7 v2 messaging
    conforms: partial
    domain_standard: true
    market: clinical information systems
    evidence: >-
      https://www.hologic.com/sites/default/files/2019-12/Dimensions%20v1.10%20and%203Dimensions%20v2.1%20DICOM%20Conf.%20Statement%20(MAN-05763)%20English%20Rev_001%2010-2019.pdf
    evidence_http_status: 200
    detail: >-
      Hologic imaging and diagnostics systems interoperate with RIS/HIS/LIS over HL7 v2 in
      the field, and the DICOM Conformance Statement describes the Modality Worklist bridge
      that HL7 order feeds drive. No standalone, publicly downloadable HL7 interface
      specification was located by this pass — the HL7 conformance detail sits in per-product
      service/integration manuals that are distributed with the device rather than published.
      Recorded as `partial` on that basis; it is a documentation gap, not a capability gap.
