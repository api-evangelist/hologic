note: >-
  Hologic publishes no public developer API and no OpenAPI document, so there are no
  securitySchemes to derive an auth profile from. The one machine-readable identity contract
  the company serves anywhere is the OpenID Connect discovery document at
  support.hologic.com, fetched anonymously and saved verbatim to
  well-known/hologic-openid-configuration.json. It governs sign-in to Hologic's customer
  support community, not an API product. The community runs on Salesforce Experience Cloud,
  so the endpoints and the scopes_supported list are the Salesforce platform's, served under
  Hologic's own domain and issuer — stated here plainly so nobody reads this as a
  Hologic-authored API authorization model.
scope_of_this_profile: >-
  Customer support portal sign-in (support.hologic.com). NOT an API product authorization
  model. No developer credential, API key, or token issuance surface is published by Hologic.
